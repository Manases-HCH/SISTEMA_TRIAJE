<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>EsSalud - Triaje Predictivo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>Datos del Paciente</h2>
        <form id="predictionForm">
            <label>Edad: <input type="number" id="edad" required></label>
            <label>Sexo:
                <select id="sexo">
                    <option value="1">Masculino</option>
                    <option value="0">Femenino</option>
                </select>
            </label>
            <label>Temperatura (°C): <input type="number" step="0.1" id="temperatura" required></label>
            <label>Frecuencia Cardíaca (lpm): <input type="number" id="fc" required></label>
            <label>Presión Sistólica (mmHg): <input type="number" id="pas" required></label>
            <label>Presión Diastólica (mmHg): <input type="number" id="pad" required></label>
            <label>Severidad del Síntoma:
                <select id="sintoma">
                    <option value="0">Leve</option>
                    <option value="1">Moderado</option>
                    <option value="2">Severo (Dolor de pecho, disnea)</option>
                </select>
            </label>
            <label>Foto de Referencia (opcional):
                <input type="file" id="foto" accept="image/*">
            </label>
            <button type="submit">Continuar</button>
        </form>

        <div id="resultado" class="card-resultado" style="display:none;">
            <h3 id="nivelRiesgo"></h3>
            <p id="recomendacion"></p>
            <small id="scoreDetalle"></small>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
