<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EsSalud - Triaje Predictivo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>Datos del Paciente</h2>
        <div id="demoBanner" class="banner" hidden>⚠️ Modo demo: modelo entrenado con datos sintéticos.</div>
        <form id="predictionForm">
            <label>Edad (años): <input type="number" id="edad" min="0" max="120" required></label>
            <label>Sexo:
                <select id="sexo">
                    <option value="1">Masculino</option>
                    <option value="0">Femenino</option>
                </select>
            </label>
            <label>Temperatura (°C): <input type="number" step="0.1" min="30" max="45" id="temperatura" required></label>
            <label>Frecuencia Cardíaca (lpm): <input type="number" min="20" max="250" id="fc" required></label>
            <label>Frecuencia Respiratoria (rpm): <input type="number" min="4" max="80" id="fr" required></label>
            <label>Presión Sistólica (mmHg): <input type="number" min="40" max="300" id="pas" required></label>
            <label>Presión Diastólica (mmHg): <input type="number" min="20" max="200" id="pad" required></label>
            <label>Saturación de O₂ (%): <input type="number" min="50" max="100" id="spo2" required></label>
            <label>Estado de conciencia:
                <select id="mental">
                    <option value="0">Alerta</option>
                    <option value="1">Responde a la voz</option>
                    <option value="2">Responde solo al dolor</option>
                    <option value="3">Inconsciente</option>
                </select>
            </label>
            <label>Dolor (0 = ninguno, 10 = máximo): <input type="number" min="0" max="10" id="dolor" value="0" required></label>
            <label><span id="fotoLabel">Foto de referencia (opcional):</span>
                <input type="file" id="foto" accept="image/*">
            </label>
            <img id="fotoPrev" class="preview" alt="Vista previa" hidden>
            <button type="submit" id="btnEnviar">Calcular riesgo</button>
        </form>

        <div id="error" class="error" role="alert" hidden></div>
        <div id="resultado" class="card-resultado" hidden>
            <h3 id="nivelRiesgo"></h3>
            <p id="recomendacion"></p>
            <p id="alertaVitales" class="error" hidden>⚠️ Signos vitales de alarma detectados.</p>
            <small id="scoreDetalle"></small>
            <p><small id="aviso"></small></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
